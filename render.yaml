# Smart Shuttle Backend — Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-shuttle-api
    runtime: node
    repo: https://github.com/nadir302/hakim-nadir
    branch: main
    plan: free

    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health

    env: production
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '5000'
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: QR_SECRET
        sync: false
      - key: UPLOAD_DIR
        value: uploads
