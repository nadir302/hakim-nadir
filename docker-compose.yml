services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: smart-shuttle-api
    restart: unless-stopped
    ports:
      - '5001:5000'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: smart-shuttle-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
