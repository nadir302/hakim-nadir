# Production override for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d
services:
  backend:
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      NODE_ENV: production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  frontend:
    ports:
      - '127.0.0.1:3000:80'
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.10'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
